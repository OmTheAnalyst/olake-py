[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "olake"
version = "0.1.0"
description = "OLake CLI: Bronze → Silver → Gold Lakehouse demo"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "typer>=0.12.0",
    "pyspark>=3.5.0",
    "databricks-sql-connector",
    "python-dotenv",
]

[project.scripts]
olake = "olake.cli:cli"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["olake*"]
