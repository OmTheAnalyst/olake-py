name: OLake CI

on:
  push:
    branches: [ "feature/phase2", "main" ]
  pull_request:
    branches: [ "feature/phase2", "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

- name: Checkout code
  uses: actions/checkout@v3
  with:
    path: .

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        cd ..
        pip install -e .
        pip install pytest pyspark==3.5.0

    - name: Run tests
      run: pytest -q
